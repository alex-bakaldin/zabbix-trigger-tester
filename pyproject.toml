[project]
name = "trigger-tester"
version = "0.1.0"
description = "Replay Zabbix 7.0 trigger expressions against item history, using the server's own evaluation engine"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
keywords = ["zabbix", "monitoring", "triggers", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/oscar/trigger-tester"

[project.scripts]
zbx-trigger-test = "trigger_tester.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trigger_tester"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
